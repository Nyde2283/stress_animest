      <script>
        let deadline = new Date(2027, 10, 15); // milieu de novembre 2027, pas la date officielle...
        // fun fact : les mois sont indicés à 0, janvier = 0, novembre = 10

        function update() {
          let now = new Date();
          let delta = (deadline - now) / 1000;

          let months = (deadline.getFullYear() - now.getFullYear()) * 12 + deadline.getMonth() - now.getMonth();
          // let days = Math.trunc(delta / (3600 * 24));
          // let hours = Math.trunc((delta % (3600*24)) / 3600);
          // let minutes = Math.trunc((delta % 3600) / 60);
          // let seconds = Math.trunc(delta % 60);

          document.getElementById("months-value").innerHTML = months;
          // document.getElementById("days-value").innerHTML = days;
          // document.getElementById("hours-value").innerHTML = hours;
          // document.getElementById("minutes-value").innerHTML = minutes;
          // document.getElementById("seconds-value").innerHTML = seconds;

          if (delta >= 24 * 3600 * 30 * 10) { // 10 mois avant la convention
            document.documentElement.style["background"] = "#6abf02"; // c'est du vert
          } else if (delta <= 0.0) {
            document.documentElement.style["background"] = "#bf0101"; // c'est du rouge
          }
        }

        update();

        setInterval(update, 1000);
      </script>
