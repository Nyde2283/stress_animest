<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="darkreader-lock">

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stress Anim'Est" />
    <meta property="og:description" content="Temps avant l'ouverture d'Anim'Est" />

    <title>Stress Anim'Est</title>
  </head>
  <body>
    <main>
      <h1>TEMPS AVANT L'OUVERTURE <a href="https://animest.net/">D'ANIM'EST</a></h1>

      <div id="counts">
        <div>
          <div class="count-value" id="days-value">69</div>
          <div class="count-label">JOURS</div>
        </div>
        <div>
          <div class="count-value" id="hours-value">69</div>
          <div class="count-label">HEURES</div>
        </div>
        <div>
          <div class="count-value" id="minutes-value">69</div>
          <div class="count-label">MINUTES</div>
        </div>
        <div>
          <div class="count-value" id="seconds-value">69</div>
          <div class="count-label">SECONDES</div>
        </div>
      </div>

      <script>
        let deadline = 1794645000;

        function update() {
          let now = Date.now() / 1000;
          let delta = deadline - now;

          let days = Math.trunc(delta / (3600 * 24));
          let hours = Math.trunc((delta % (3600*24)) / 3600);
          let minutes = Math.trunc((delta % 3600) / 60);
          let seconds = Math.trunc(delta % 60);

          document.getElementById("days-value").innerHTML = days;
          document.getElementById("hours-value").innerHTML = hours;
          document.getElementById("minutes-value").innerHTML = minutes;
          document.getElementById("seconds-value").innerHTML = seconds;

          if (delta <= 0.0) {
            document.documentElement.style["background"] = "#bf0101";
          }
        }

        update();

        setInterval(update, 1000);
      </script>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');

        html {
          font-family: "Nunito", sans-serif;
          background: #ebae3d;
          color: #15141A;
          height: 100%;
        }

        body {
          display: flex;
          margin: 0;
          padding-left: 2em;
          padding-right: 2em;
          text-align: center;
          height: 100%;
        }

        main {
          margin: auto;
        }

        h1 {
          font-size: 30pt;
          text-align: center;
        }

        #counts > div {
          display: inline-block;
          margin: 0 2em 2em 2em;
        }

        div.count-value {
          font-size: 60pt;
        }

        div.count-label {
          font-size: 24pt;
        }

        code {
          font-size: 0.9em;
        }
      </style>

      <br>
      <br>
      <br>
      <br>
    </main>
  </body>
</html>
